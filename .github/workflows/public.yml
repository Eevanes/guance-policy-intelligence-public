name: Public code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e './agent[dev]' -r web/backend/requirements.txt
      - run: python scripts/check_public_boundary.py
      - run: python -m pytest -q
        working-directory: agent
      - run: python -m ruff check agent
      - run: python -m pytest -q tests
        working-directory: web/backend
      - run: python -m pytest -q ci_tests
        working-directory: rag库/检索工程
